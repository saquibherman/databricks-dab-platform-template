resources:
  jobs:
    citibike_etl_pipeline_nb:
      name: citibike_etl_pipeline_nb
      # Tasks without job_cluster_key run on serverless (currently all tasks).
      # To use classic compute, set `job_cluster_key: <key>` on a task (clusters defined under job_clusters).
      performance_target: STANDARD
      tasks:
        - task_key: 01_bronze_citibike
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/01_bronze/01_bronze_citibike.ipynb
            base_parameters:
              pipeline_id: "{{job.id}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              catalog: "${var.catalog}"
            source: WORKSPACE
          environment_key: dab_project_env
        - task_key: 02_silver_citibike
          depends_on:
            - task_key: 01_bronze_citibike
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/02_silver/02_silver_citibike.ipynb
            base_parameters:
              pipeline_id: "{{job.id}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              catalog: "${var.catalog}"
            source: WORKSPACE
          environment_key: dab_project_env
        - task_key: 03_gold_citibike_daily_ride_summary
          depends_on:
            - task_key: 02_silver_citibike
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/03_gold/03_gold_citibike_daily_ride_summary.ipynb
            base_parameters:
              pipeline_id: "{{job.id}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              catalog: "${var.catalog}"
            source: WORKSPACE
          environment_key: dab_project_env
        - task_key: 03_gold_citibike_daily_station_performance
          depends_on:
            - task_key: 02_silver_citibike
          notebook_task:
            notebook_path: ../citibike_etl/notebooks/03_gold/03_gold_citibike_daily_station_performance.ipynb
            base_parameters:
              pipeline_id: "{{job.id}}"
              run_id: "{{job.run_id}}"
              task_id: "{{task.run_id}}"
              processed_timestamp: "{{job.start_time.iso_datetime}}"
              catalog: "${var.catalog}"
            source: WORKSPACE
          environment_key: dab_project_env
      # Serverless tasks get libraries from an environment (task-level `libraries` is not
      # supported on serverless). The wheel is built from src/ by the `artifacts` block in databricks.yml.
      environments:
        - environment_key: dab_project_env
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      job_clusters:
        # Defined but not used by any task yet; set `job_cluster_key: single_node_small` on a task to use it.
        - job_cluster_key: single_node_small
          new_cluster: "${var.single_node_small}"
        # Defined but not used by any task yet; set `job_cluster_key: d4ds_v5` on a task to use it.
        - job_cluster_key: d4ds_v5
          new_cluster: "${var.d4ds_v5}"
      queue:
        enabled: true
