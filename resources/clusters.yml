variables:
    d4ds_v5:
        type: "complex"
        default:
            cluster_name: ""
            spark_version: 18.x-scala2.13
            azure_attributes:
                first_on_demand: 1
                availability: SPOT_WITH_FALLBACK_AZURE
                spot_bid_max_price: -1
            node_type_id: Standard_D4ds_v5
            enable_elastic_disk: true
            data_security_mode: DATA_SECURITY_MODE_AUTO
            runtime_engine: PHOTON
            num_workers: 8

    # Small single-node cluster for light tasks (e.g. bronze CSV ingest).
    # No workers to provision and on-demand VMs (no spot wait) -> faster, more predictable start.
    single_node_small:
        type: "complex"
        default:
            spark_version: 18.x-scala2.13
            node_type_id: Standard_D4ds_v5
            num_workers: 0
            spark_conf:
                spark.databricks.cluster.profile: singleNode
                spark.master: "local[*, 4]"
            custom_tags:
                ResourceClass: SingleNode
            azure_attributes:
                first_on_demand: 1
                availability: ON_DEMAND_AZURE
            data_security_mode: DATA_SECURITY_MODE_AUTO
